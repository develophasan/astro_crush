name: "Android Export"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup AdMob Config
        run: |
          mkdir -p addons/AdmobPlugin
          cat << 'EOF' > addons/AdmobPlugin/android_export.cfg
          [General]
          is_real=true
          [Debug]
          app_id="ca-app-pub-7470017453637950~1769028185"
          [Release]
          app_id="ca-app-pub-7470017453637950~1769028185"
          EOF

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.2-stable_linux.x86_64.zip
          mv Godot_v4.6.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q Godot_v4.6.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable/
          mv templates/* ~/.local/share/godot/export_templates/4.6.2.stable/

      - name: Import Godot Project
        run: |
          ./godot --headless --editor --quit || true

      - name: Install Android Build Template
        run: |
          ./godot --headless --install-android-build-template

      - name: Generate Android Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "astrocrush" -keypass "astrocrush" -dname "CN=Astro Crush,O=Game,C=TR"

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "/home/runner/work/astro_crush/astro_crush/release.keystore"
          export/android/debug_keystore_user = "release"
          export/android/debug_keystore_pass = "astrocrush"
          EOF

      - name: Export APK
        run: |
          mkdir -p build
          ./godot --headless --export-release "Android" build/AstroCrush.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroCrush-Android-APK
          path: build/AstroCrush.apk
