name: "Android Export"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Install Android Build Template
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q Godot_v4.6.2-stable_export_templates.tpz
          mkdir -p android/build
          unzip -q templates/android_source.zip -d android/build/
          echo "Installed Android build template for Custom Build"

      - name: Generate Android Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "astrocrush" -keypass "astrocrush" -dname "CN=Astro Crush,O=Game,C=TR"

      - name: Export APK
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          export_debug: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroCrush-Android-APK
          path: /home/runner/.local/share/godot/archives/*
